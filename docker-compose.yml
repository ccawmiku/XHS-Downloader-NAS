version: "3.9"

services:
  xhs-api:
    image: joeanamier/xhs-downloader
    container_name: xhs-api
    ports:
      - "13001:5556"
    volumes:
      - /volume1/docker/xhs-downloader/volumes:/app/Volume
      - /volume1/se/小红书:/xhs
    tty: true
    stdin_open: true
    command: python main.py api
    restart: unless-stopped

  xhs-auto-worker:
    image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    container_name: xhs-auto-worker
    depends_on:
      - xhs-api
    working_dir: /app
    ports:
      - "13003:8080"
    volumes:
      - /volume1/docker/xhs-downloader/nas-auto:/app
      - /volume1/docker/xhs-downloader/auto/config:/config
      - /volume1/docker/xhs-downloader/auto/queue:/queue
      - /volume1/docker/xhs-downloader/auto/state:/state
      - /volume1/docker/xhs-downloader/volumes:/xhs-volume
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "python -c 'from playwright.async_api import async_playwright' 2>/dev/null
      || python -m pip install --no-cache-dir playwright==1.56.0;
      python /app/xhs_auto_worker.py --config /config/config.json"
    restart: unless-stopped
